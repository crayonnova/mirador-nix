name: macOS Nix Build Test

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check -L

      - name: Build
        run: nix build .#default -L

      - name: Smoke test
        run: |
          ./result/bin/mirador --version
          nix run . -- --version
