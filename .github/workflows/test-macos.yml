name: Interactive macOS Nix Test

on: 
  workflow_dispatch: # Allows you to trigger the test manually from the GitHub UI

jobs:
  tui-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Diagnose tmux
        run: |
          brew install tmux upterm || brew install tmux
          tmux -V
          tmux new-session -d -s probe 'sleep 60' || echo "tmux new-session FAILED rc=$?"
          tmux ls || echo "tmux ls FAILED rc=$?"
          tmux kill-session -t probe || true

      - name: Setup upterm session
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true
